name: ts-next-task-app

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5439:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1026:1025" # SMTP
      - "8026:8025" # web UI

  # One-shot job that applies migrations, then exits. Part of the `app` profile.
  migrate:
    profiles: ["app"]
    build:
      context: .
      target: builder
    command: pnpm db:migrate
    environment:
      DATABASE_URL: postgres://app:app@db:5432/app
    depends_on:
      db:
        condition: service_healthy

  app:
    profiles: ["app"]
    build:
      context: .
      target: runner
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://app:app@db:5432/app
      SESSION_SECRET: docker-dev-secret-0123456789abcdef0123456789abcdef
      APP_URL: http://localhost:3000
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      MAIL_TRANSPORT: smtp
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailhog:
        condition: service_started

volumes:
  db-data:
